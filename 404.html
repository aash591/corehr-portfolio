<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#17181c;--ink-3:#62666e;--paper:#f8f7f4;--red:#C8102E;--red-deep:#a30d25;--line:rgba(23,24,28,.17)}
body{
  min-height:100svh;display:grid;place-items:center;padding:32px 22px;
  font:500 16px/1.65 'Manrope',ui-sans-serif,sans-serif;color:#3f424a;background:var(--paper);
  background-image:radial-gradient(rgba(23,24,28,.055) 1px,transparent 1.35px);background-size:24px 24px;
  text-align:center;
}
.card{max-width:520px}
.mark{
  width:66px;height:60px;margin:0 auto 28px;position:relative;overflow:hidden;
  background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(23,24,28,.05),0 12px 30px -16px rgba(23,24,28,.3);

.mark img{position:absolute;top:-10.2%;left:-32.4%;height:177%;width:auto;max-width:none}

h1{font:700 clamp(1.9rem,6vw,2.7rem)/1.1 'Sora',sans-serif;color:var(--ink);letter-spacing:-.03em;margin-bottom:14px}
p{color:var(--ink-3);margin-bottom:30px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  font:600 15px 'Manrope',sans-serif;padding:14px 22px;border-radius:12px;
  border:1px solid transparent;transition:background .2s,border-color .2s,transform .2s;
}
.p{background:var(--red);color:#fff}
.p:hover{background:var(--red-deep);transform:translateY(-1px)}
.g{background:#fff;color:var(--ink);border-color:var(--line)}
.g:hover{border-color:var(--ink-3);transform:translateY(-1px)}
@media (max-width:420px){.row a.btn{flex:1 1 100%;justify-content:center}}
